# XcodeGen spec:
#   cd Examples/TicTacToe && xcodegen generate && open TicTacToe.xcodeproj
name: TicTacToe
options:
  bundleIdPrefix: dev.swiftmcpapphost
  deploymentTarget:
    iOS: "17.0"
packages:
  SwiftMCPAppHost:
    path: ../..
targets:
  TicTacToe:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: SwiftMCPAppHost
        product: SwiftMCPAppHost
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: TicTacToe
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.swiftmcpapphost.tictactoe
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
